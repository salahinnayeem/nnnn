<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Spelling & Vocabulary Typing Meter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg-color: #f8fafc;
            --text-main: #334155;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --correct: #10b981;
            --incorrect: #ef4444;
            --card-bg: #ffffff;
            --overtime: #dc2626;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 950px;
            margin: 40px auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-weight: 600;
            margin-bottom: 10px;
        }

        .session-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 30px;
            max-height: 220px;
            overflow-y: auto;
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #ffffff;
        }

        .session-btn {
            background-color: var(--card-bg);
            border: 1px solid #e2e8f0;
            padding: 10px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s ease;
        }

        .session-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .session-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .typing-area {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            position: relative;
            margin-bottom: 20px;
            outline: none;
            cursor: text;
        }

        .text-display {
            font-size: 1.2rem;
            line-height: 1.8;
            color: var(--text-muted);
            margin-bottom: 20px;
            user-select: none;
            max-height: 320px;
            overflow-y: auto;
        }

        .text-display span {
            transition: color 0.1s;
        }

        .text-display span.correct {
            color: var(--correct);
        }

        .text-display span.incorrect {
            color: var(--incorrect);
            background-color: #fee2e2;
            border-radius: 2px;
        }

        .text-display span.active {
            border-bottom: 2px solid var(--primary);
            color: var(--text-main);
        }

        .hidden-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .live-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: var(--text-muted);
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
        }

        .timer-badge {
            padding: 4px 10px;
            border-radius: 6px;
            background: #f1f5f9;
            transition: all 0.3s ease;
        }

        .timer-badge.overtime {
            background: #fee2e2;
            color: var(--overtime);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.85; }
            to { opacity: 1; }
        }

        .result-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .result-content {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            max-width: 420px;
            width: 90%;
        }

        .result-content h2 {
            margin-top: 0;
            color: var(--text-main);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 25px 0;
        }

        .stat-box {
            background: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
        }

        .stat-box span {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .stat-box strong {
            display: block;
            font-size: 1.35rem;
            color: var(--primary);
            margin-top: 4px;
        }

        .stat-box.overtime strong {
            color: var(--overtime);
        }

        .restart-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .restart-btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>IELTS Spelling & Vocabulary Typing Practice</h1>
            <p>Target Pace: 8 Words Per Minute (Auto-calculated Target Time)</p>
        </header>

        <div class="session-grid" id="sessionGrid"></div>

        <div class="typing-area" id="typingArea" tabindex="0">
            <div class="text-display" id="textDisplay">Select a session to begin.</div>
            <div class="live-stats">
                <div id="liveTimer" class="timer-badge">Target: 0s | Time Left: 0s</div>
                <div id="liveWpm">WPM: 0</div>
            </div>
            <input type="text" class="hidden-input" id="hiddenInput">
        </div>
    </div>

    <div class="result-modal" id="resultModal">
        <div class="result-content">
            <h2>Session Completed!</h2>
            <div class="stat-grid">
                <div class="stat-box">
                    <span>Target Time</span>
                    <strong id="resTarget">0s</strong>
                </div>
                <div class="stat-box" id="resTimeBox">
                    <span>Actual Time</span>
                    <strong id="resTime">0s</strong>
                </div>
                <div class="stat-box">
                    <span>Average WPM</span>
                    <strong id="resAvgWpm">0</strong>
                </div>
                <div class="stat-box">
                    <span>Accuracy</span>
                    <strong id="resAcc">100%</strong>
                </div>
            </div>
            <button class="restart-btn" onclick="closeModal()">Practice Again</button>
        </div>
    </div>

    <script>
        const sessionsData = [
            { title: "1. Days and Months", words: "Monday Tuesday Wednesday Thursday Friday Saturday Sunday Weekdays Weekend January February March April May June July August September October November December" },
            { title: "2. Money Matters", words: "Cash Debit Credit card Cheque In advance Annual fee Monthly membership Interest rate Deposit Tuition fees Poverty Bank statement Money management Current account Student account Withdraw Low-risk investment Mortgage Grace period Budget deficit Retail voucher Coupon Counterfeit money Public money Tax payers' money Debt Interest-free credit Purchase Partial refund Annuity Non-refundable Master card Visa Distribution costs Income Finance department Family finances Duty-free store" },
            { title: "3. Subjects", words: "Science Politics History Biology Architecture Law Geography Archaeology Literature Business management Agriculture Statistics Mathematics Logic Physics Psychology Anthropology Economics Philosophy Performing arts Visual arts Chemistry Humanities" },
            { title: "4. Studying at College", words: "Course outline Group discussion Handout Written work Report writing Research Proofreading Experiment Experience Reference Textbook Dictionary Laptop Printer Student advisor Teamwork Module Topic Assessment Library Department Computer center Classroom Lecture Tutor Main hall Attendance Deadline Give a talk Speech Computer laboratory Certificate Diploma Placement test Overseas students Full-time Facilities College Dining room Specialist Knowledge International Accommodation Homestay Primary Secondary Intermediate Media room Resources room Staff Commencement Dissertation Leaflet Faculty Pupils Pencil Feedback Tasks Outcomes Advanced Introductory Extra background Higher education Guidelines Post-secondary Supervisor Bachelor's degree Compound Vocabulary Student support services Student retention Publication Foreign students Schedule School reunion Registrar's office Stationery" },
            { title: "5. Marketing", words: "Catalog Interview Newsletter Competition Tv program Strategies Research method Entertainment industry Leadership Management Display Products Customer Special offer Collecting data Questionnaire Survey Mass media Statistic Profit margin Poll Business card Training Trainee Merchandise Manufacture Recruitment" },
            { title: "6. Health", words: "Yoga Keep-fit Salad bar Vegetarian Outdoor activities Leisure time Disease Meal Protein Balanced diet Food pyramid Vitamin Carbohydrates Rice Pasta Potatoes Pizza Tomatoes Bread Cereals Minerals Zinc Meat Seafood Eggs Beans Milk Cheese Yoghurt Fruit Vegetables Citrus fruits Green pepper Blackcurrant Nuts Egg yolk Liver Medicine Treatment Remedy Nursing care Nursery Regular exercise" },
            { title: "7. Nature", words: "Field Footbridge Environment Waterfall River Mountain Forest Village Coast Reef Lake Valley Hill Cliff Island Peninsula Earthquake Avalanche Tornado Typhoon Desertification Volcano Disaster Catastrophe Erosion Landslides Storm Flood Hurricane Pond Jungle Oasis Dam Canyon" },
            { title: "8. The Environment", words: "Greenhouse effect Acid rain Global warming Carbon dioxide Burning fossil Exhaust fumes Deforestation Nitrogen oxide Smog Climate Pollution Temperature Power plants Landfill Cattle Wind turbine Solar power Hydroelectric power Renewable Source of energy Reliable Solar panels Environmentally friendly Oxygen Chemical-free Desert Degradation Vegetation Sea level Ocean currents Soil conditioner Coal Fossil fuels Firewood Drought Contaminated" },
            { title: "9. Animal Kingdom", words: "Birds of prey Seabirds Poultry and game Mammals Cetacean Whale Primates Rodents Fish Amphibian Reptile Insects Octopus Phylum Class Order Family Genus Species Livestock Creature Lion Penguin" },
            { title: "10. Plants", words: "Mushroom Fungus Leaves Seed Core Bark Trunk Twig Branch Flower Stem Roots Cluster Fertilizer" },
            { title: "11. Continents", words: "South america North america Africa Asia Europe Australia Antarctica" },
            { title: "12. Countries", words: "Egypt Mexico France Indonesia Turkey England Germany China Greece Brazil India North korea Malaysia New zealand Nigeria Pakistan Singapore Switzerland United kingdom Italy The dominican republic The philippines Denmark" },
            { title: "13. Languages", words: "Linguistics Bilingual Trilingual Polyglot Portuguese Mandarin Bengali Chinese Hindi Russian Japanese German Punjabi Thai Persian Filipino French Italian Greek" },
            { title: "14. Architecture", words: "Dome Palace Fort Castle Glasshouse Pyramid Log cabin Lighthouse Hut Skyscraper Sculpture" },
            { title: "15. Homes", words: "Semi-detached house Duplex Terraced house Town house Row house Bungalow Thatched cottage Mobile home Houseboat Block of flats Apartment building Condominium Chimney Bedroom Basement Landlord Tenant Rent Lease Neighborhood Suburb Sofa Coffee table Dormitory Storey Kitchen Refrigerator Microwave Ground floor Oven Hallway Insurance" },
            { title: "16. Cities", words: "Cities Street Lane City centre Central station Car park Department store Bridge Temple Embassy Road system Hospital Garden" },
            { title: "17. Workplaces", words: "Clinic Dentist Reception Appointment Staff Selection Colleague Workshop Showroom Information desk Employer Employment Unemployed Technical cooperation Team leaders Stress Ability Vision Confidence Employee Internship" },
            { title: "18. Rating & Qualities", words: "Reasonable Satisfactory Dangerous Safe Strongly recommended Poor quality Satisfied Disappointed Efficient Luxurious Colored Spotted Striped Expensive Cheap" },
            { title: "19. Tour", words: "Tourist guided tour Ticket office Souvenir Trip Guest Reservation View Culture Memorable Single/double bedded room Picnic Tourist attraction Hostel Suite Aquarium" },
            { title: "20. Verbs", words: "Train Develop Collect Supervise Mark Edit Revise Exhibit Donate Surpass Register Support Hunt Persuade Concentrate Discuss Suggest Arrange Borrow Immigrate Review Learn Touch" },
            { title: "21. Adjectives", words: "Energetic Social Ancient Necessary Fantastic Exciting Fabulous Dull Comfortable Convenient Suitable Affordable Voluntary Mandatory Compulsory Temporary Permanent Immense Vast Salty Extinct Vulnerable Pessimistic Optimistic Realistic Practical Knowledgeable Flexible Confident Western Intensive Tranquil Spectacular Intact Various" },
            { title: "22. Hobbies", words: "Orienteering Caving Spelunking Archery Ice skating Scuba-diving Snorkeling Skateboarding Bowls Darts Golf Billiards Photography Painting Pottery Woodcarving Gardening Stamp collection Embroidery Climbing Chess Parachute" },
            { title: "23. Sports", words: "Cricket Baseball Basketball Rugby Soccer American football Hockey Swimming Tennis Squash Badminton Ping-pong Field Court Pitch Stadium Team The discus The javelin The hammer The high jump Horse racing Show jumping Polo Cycling Gymnasium Athlete Gym Extreme sports Paragliding Hang-gliding Skydiving Abseiling Snowboarding Bungee jumping Surfing Windsurfing Jet-skiing Body boarding White-water rafting Kite surfing Mountain biking Jogging Press-up Push-up Barbell Treadmill Judo Recreation Snooker Walking Championship Canoeing Refreshment" },
            { title: "24. Shapes", words: "Square Rectangular Triangular Polygon Oval Spherical Spiral Circular Curved Cylindrical" },
            { title: "25. Measurements", words: "width length altitude imperial system metric system mass depth breadth height three dimensions frequency" },
            { title: "26. Transportations", words: "Cargo plane Shipment Container ship Boat Lifeboat Ferry Hovercraft Hydrofoil Liner Canal boat Narrow boat Dinghy sailing Sailboat Paddle steamer Cabin cruiser Rowing boat Rowboat Kayak Canoe Punt Gondola Aircraft Helicopter Seaplane Airship Hot-air balloon" },
            { title: "27. Weather", words: "Humid Hot Sticky Breeze Chilly Cold Cool Dry Dusty Freezing Warm Wet Weather forecast Antenna Moisture" },
            { title: "28. Places", words: "Local library Swimming pool Cafeteria Cottage Parliament Accommodation Restaurant Canteen Café Bookshop Sports centre City council Dance studio Park Conversation club Kindergarten" },
            { title: "29. Equipment & Tools", words: "Helmet Light Musical instrument Cassette Silicon chip Digital monitor Gadget Device Screen Brakes Wheels Mechanical pencil Disk Backpack" },
            { title: "30. The Arts & Media", words: "Opera Orchestra Concert Symphony The press Conductor Vocalist Audience Festival Carnival Exhibition Classical music Theatre Cinema Art gallery Museum Ballet Television Radio Graphics Newspaper" },
            { title: "31. Materials", words: "Fur Metal Steel Aluminum Copper Rubber Plastic Ceramics Glass Cement Stone Textile Cotton Fabric Wool Leather Bone Paper Lumber/wood Glue Composite Fiberglass Concrete Wax Silver Gold Feather" },
            { title: "32. Works and Jobs", words: "Occupation Profession Designer Decorator Architect Engineer Manager Waitress Waiter Teacher Vacancy Professor Specialist Psychologist Volunteer Freelance Secretary Craftsman Work experience Curriculum vitae Mail address Receptionist Pilot Guard Flight attendant Lecturer Office assistant Clerk Accountant Cashier Captain" },
            { title: "33. Colors", words: "Blue White Orange Green Grey Black Red Yellow Purple Brown Pink" },
            { title: "34. Expressions & Time", words: "Three times Three times per week A gap year Full-time Part-time Midday Midnight Millennium Century Decade Fortnight" },
            { title: "35. Other Terms", words: "Passport photo State Government Individual Variety Private sector Practice Gender Creativity Original inhabitant Indigenous Demonstration Strike Entrance Circuit Guarantee Dialog Commerce Carriage Narrative Chocolate Satellite Decision Prototype Attitude Daily routine Personal fulfillment Activity Recipient Ultrasound Pedestrian safety Traffic jams Procedures Creation Prize Junior Senior Opportunity Driving license Process Literary Man-made Republicans Umbrella Frequently updated Waiting list Sewer systems Liberal democracy Democrats Lunar calendar Libertarian Burger Videos Nature conservation Life expectancy Fund-raising event Magnet Dialect Ramification Straight Farewell Welfare Encyclopedia Evolution Revolution Illiteracy Robot Proficiency Sufficient" }
        ];

        const sessionGrid = document.getElementById('sessionGrid');
        const textDisplay = document.getElementById('textDisplay');
        const hiddenInput = document.getElementById('hiddenInput');
        const typingArea = document.getElementById('typingArea');
        const liveTimer = document.getElementById('liveTimer');
        const liveWpm = document.getElementById('liveWpm');
        const resultModal = document.getElementById('resultModal');

        let currentText = "";
        let characterSpans = [];
        let currentIndex = 0;
        let timer = null;
        let startTime = null;
        let isPlaying = false;
        
        let targetDurationSec = 0;
        let totalErrors = 0;
        let currentSessionIndex = 0;

        function initSessions() {
            sessionGrid.innerHTML = '';
            sessionsData.forEach((s, idx) => {
                const btn = document.createElement('button');
                btn.className = 'session-btn';
                btn.title = s.title;
                btn.innerText = s.title;
                btn.onclick = () => loadSession(idx, btn);
                sessionGrid.appendChild(btn);
            });
        }

        function loadSession(index, btnElement) {
            currentSessionIndex = index;
            document.querySelectorAll('.session-btn').forEach(b => b.classList.remove('active'));
            
            if(!btnElement) {
                btnElement = document.querySelectorAll('.session-btn')[index];
            }
            if(btnElement) {
                btnElement.classList.add('active');
                btnElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            currentText = sessionsData[index].words.trim();
            textDisplay.innerHTML = '';
            characterSpans = [];
            currentIndex = 0;
            totalErrors = 0;
            
            // Pace: 8 WPM => 8 words takes 60 seconds
            const wordCount = currentText.split(/\s+/).length;
            targetDurationSec = Math.round((wordCount / 8) * 60);

            currentText.split('').forEach(char => {
                const span = document.createElement('span');
                span.innerText = char;
                textDisplay.appendChild(span);
                characterSpans.push(span);
            });

            if (characterSpans.length > 0) {
                characterSpans[0].classList.add('active');
            }

            resetStats();
            typingArea.focus();
        }

        function resetStats() {
            clearInterval(timer);
            startTime = null;
            isPlaying = false;
            liveTimer.className = 'timer-badge';
            liveTimer.innerText = `Target: ${formatTime(targetDurationSec)} | Left: ${formatTime(targetDurationSec)}`;
            liveWpm.innerText = "WPM: 0";
            hiddenInput.value = '';
        }

        function startTimer() {
            if (!isPlaying) {
                isPlaying = true;
                startTime = new Date();
                
                timer = setInterval(() => {
                    const elapsed = Math.floor((new Date() - startTime) / 1000);
                    const remaining = targetDurationSec - elapsed;

                    if (remaining >= 0) {
                        liveTimer.className = 'timer-badge';
                        liveTimer.innerText = `Time Left: ${formatTime(remaining)}`;
                    } else {
                        liveTimer.className = 'timer-badge overtime';
                        liveTimer.innerText = `Overtime: +${formatTime(Math.abs(remaining))}`;
                    }

                    calculateLiveWpm(elapsed);
                }, 1000);
            }
        }

        function calculateLiveWpm(elapsedSec) {
            if (elapsedSec <= 0) return;
            const minutes = elapsedSec / 60;
            const correctChars = document.querySelectorAll('.text-display span.correct').length;
            const currentWpm = Math.round((correctChars / 5) / minutes);
            liveWpm.innerText = `WPM: ${currentWpm}`;
        }

        function endSession() {
            clearInterval(timer);
            isPlaying = false;

            const totalTimeSec = Math.max(1, Math.floor((new Date() - startTime) / 1000));
            const timeInMin = totalTimeSec / 60;
            const correctChars = document.querySelectorAll('.text-display span.correct').length;
            const totalTyped = correctChars + totalErrors;
            
            const avgWpm = Math.round((correctChars / 5) / timeInMin);
            const accuracy = totalTyped > 0 ? Math.round((correctChars / totalTyped) * 100) : 100;

            document.getElementById('resTarget').innerText = formatTime(targetDurationSec);
            const actualTimeEl = document.getElementById('resTime');
            actualTimeEl.innerText = formatTime(totalTimeSec);
            
            const timeBox = document.getElementById('resTimeBox');
            if (totalTimeSec > targetDurationSec) {
                timeBox.className = 'stat-box overtime';
                actualTimeEl.innerText += ` (+${formatTime(totalTimeSec - targetDurationSec)})`;
            } else {
                timeBox.className = 'stat-box';
            }

            document.getElementById('resAvgWpm').innerText = avgWpm;
            document.getElementById('resAcc').innerText = `${accuracy}%`;

            resultModal.style.display = 'flex';
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return m > 0 ? `${m}m ${s}s` : `${s}s`;
        }

        function closeModal() {
            resultModal.style.display = 'none';
            loadSession(currentSessionIndex);
        }

        typingArea.addEventListener('click', () => hiddenInput.focus());
        
        hiddenInput.addEventListener('input', (e) => {
            if (currentIndex >= characterSpans.length) return;
            
            startTimer();
            
            const typedChar = e.target.value;
            hiddenInput.value = ''; 

            const expectedChar = currentText[currentIndex];

            if (typedChar === expectedChar) {
                characterSpans[currentIndex].classList.add('correct');
                characterSpans[currentIndex].classList.remove('incorrect');
            } else {
                characterSpans[currentIndex].classList.add('incorrect');
                characterSpans[currentIndex].classList.remove('correct');
                totalErrors++;
            }

            characterSpans[currentIndex].classList.remove('active');
            currentIndex++;

            if (currentIndex < characterSpans.length) {
                characterSpans[currentIndex].classList.add('active');
                characterSpans[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                endSession();
            }
        });

        hiddenInput.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && currentIndex > 0) {
                characterSpans[currentIndex]?.classList.remove('active');
                currentIndex--;
                characterSpans[currentIndex].classList.remove('correct', 'incorrect');
                characterSpans[currentIndex].classList.add('active');
                characterSpans[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        });

        initSessions();
        loadSession(0);
    </script>
</body>
</html>
